name: Family Life CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build RimWorld 1.7
        run: |
          for project in FamilyLife/FamilyLife Education/WilsEducation Care/WilsCommunityCare Treasury/WilsTreasury; do
            dotnet build "Source/$project.csproj" -c Release -p:GameVersion=1.7 -v minimal || exit 1
          done
      - name: Build RimWorld 1.6
        run: |
          for project in FamilyLife/FamilyLife Education/WilsEducation Care/WilsCommunityCare Treasury/WilsTreasury; do
            dotnet build "Source/$project.csproj" -c Release -p:GameVersion=1.6 -v minimal || exit 1
          done
      - name: Test domain and assembly contracts
        run: dotnet test Source/FamilyLife.Tests/FamilyLife.Tests.csproj -c Release
      - name: Generate calibration
        run: dotnet run --project tools/StoryCalibration -- /tmp/family-life-calibration
      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: family-life-calibration
          path: /tmp/family-life-calibration
      - name: Verify calibration snapshots
        run: |
          for snapshot in controlled-outcomes.csv coverage.csv frequencies.csv summary.md; do
            diff -u "docs/calibration/$snapshot" "/tmp/family-life-calibration/$snapshot"
          done
